[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdt-dev"
version = "0.1.0"
description = "Process Deploy Tool: Git-native runtime for state-bounded operational AI workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dev-tools", "infrastructure", "ai-agents", "workflow-automation", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
dependencies = [
    "click>=8.0.0", # Clean framework for building beautiful terminal CLIs
    "fastapi>=0.136.3",
    "google-genai>=2.8.0",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
    "typer>=0.26.7",
    "uvicorn>=0.49.0",
]

[project.scripts]
pdt = "pdt_cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pdt_cli"]
